services:
  vitals_db:
    restart: "no"

  vitals_redis:
    restart: "no"

  vitals_migrate:
    restart: "no"

  vitals_db_roles:
    restart: "no"

  vitals_app:
    restart: "no"
    read_only: true
    ports: !reset []
    environment:
      VITALS_RESTORE_DRILL: "true"
    networks:
      - default
      - proxy_backend
    volumes:
      - type: bind
        source: ${VITALS_DRILL_RUNTIME_ENV_DIR:?VITALS_DRILL_RUNTIME_ENV_DIR is required}
        target: /run/vitals-runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_GARMIN_DIR:?VITALS_DRILL_GARMIN_DIR is required}
        target: /data/garmin_session
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_LEGACY_UPLOAD_DIR:?VITALS_DRILL_LEGACY_UPLOAD_DIR is required}
        target: /app/web/static/uploads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_PRIVATE_FILES_DIR:?VITALS_DRILL_PRIVATE_FILES_DIR is required}
        target: /data/private_files
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m

  vitals_worker:
    restart: "no"
    read_only: true
    environment:
      VITALS_RESTORE_DRILL: "true"
    networks:
      - default
    volumes:
      - type: bind
        source: ${VITALS_DRILL_RUNTIME_ENV_DIR:?VITALS_DRILL_RUNTIME_ENV_DIR is required}
        target: /run/vitals-runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_GARMIN_DIR:?VITALS_DRILL_GARMIN_DIR is required}
        target: /data/garmin_session
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_LEGACY_UPLOAD_DIR:?VITALS_DRILL_LEGACY_UPLOAD_DIR is required}
        target: /app/web/static/uploads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VITALS_DRILL_PRIVATE_FILES_DIR:?VITALS_DRILL_PRIVATE_FILES_DIR is required}
        target: /data/private_files
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m

  # Docker does not publish host ports for a container attached only to an
  # internal bridge. This fixed byte proxy carries no credentials or mounts;
  # only it reaches the non-internal ingress bridge, while the app keeps no
  # outbound route.
  vitals_drill_proxy:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-vitals}_runtime:${VITALS_IMAGE_TAG:-local}
    command: ["python", "scripts/serve_restore_drill_proxy.py"]
    environment:
      VITALS_RESTORE_DRILL_PROXY: "true"
    ports:
      - "127.0.0.1:${VITALS_APP_PORT:?VITALS_APP_PORT is required}:8000"
    networks:
      - proxy_backend
      - ingress
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    restart: "no"

  # A drill consumes an already published exact bundle. It must never create or
  # rotate artifacts while proving recovery from that bundle.
  vitals_backup:
    profiles: ["restore-drill-disabled"]
    restart: "no"

networks:
  default:
    internal: true
  proxy_backend:
    internal: true
  ingress:
