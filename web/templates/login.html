{% extends "base.html" %}

{% block title %}{{ t("login.page_title") }}{% endblock %}

{% block content %}
<style>
    /* Login screen — variant 1B. The form stands directly on the page
       background: no card, no glass, no blobs. Fields are lines, not boxes,
       so the only filled shape on screen is the one thing you press. */
    .lg-wrap {
        position: relative;
        min-height: 85dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .lg-mark {
        position: absolute;
        top: 2rem;
        left: 2.5rem;
        font-family: var(--display);
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--fg);
    }

    .lg-form {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 2.125rem;
    }

    .lg-title {
        margin: 0;
        font-size: 36px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--fg);
    }

    .lg-fields {
        display: flex;
        flex-direction: column;
        gap: 1.625rem;
    }

    /* The line is the field. Rest → --line, focus → accent, error → --bad. */
    .lg-field {
        display: flex;
        flex-direction: column;
        gap: .5rem;
        padding-bottom: .625rem;
        border-bottom: 1px solid var(--line);
        transition: border-color .15s ease;
    }

    .lg-field:focus-within {
        border-bottom-color: var(--accent);
    }

    .lg-field.is-error {
        border-bottom-color: var(--bad);
    }

    .lg-field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .lg-label {
        margin: 0;
        font-size: 11px;
        letter-spacing: .12em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--faint);
    }

    .lg-field.is-error .lg-label {
        color: var(--bad);
    }

    /* Not .v-input — that class is a filled box; here the input is bare text. */
    .lg-input {
        width: 100%;
        background: transparent;
        border: 0;
        padding: 0;
        font-family: inherit;
        /* 21px is well over the 16px below which iOS zooms the viewport on focus. */
        font-size: 21px;
        font-weight: 500;
        color: var(--fg);
    }

    .lg-input:focus {
        outline: none;
    }

    .lg-input::placeholder {
        color: var(--faint);
    }

    /* Autofill would otherwise repaint a white box over the transparent field. */
    .lg-input:-webkit-autofill,
    .lg-input:-webkit-autofill:hover,
    .lg-input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--fg);
        -webkit-box-shadow: 0 0 0 100px var(--bg) inset;
        caret-color: var(--fg);
    }

    #lg-password {
        letter-spacing: .06em;
    }

    /* Padding + matching negative margin: the hit area grows past the 11px
       line without moving anything on screen. */
    .lg-reveal {
        background: none;
        border: 0;
        padding: .625rem 0;
        margin: -.625rem 0;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--muted);
        transition: color .15s ease;
    }

    .lg-reveal:hover {
        color: var(--fg);
    }

    .lg-foot {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    /* Error sits above the button, in text — an alert box here would put a
       second filled shape next to the CTA and split the eye. */
    .lg-error {
        font-size: var(--text-body);
        line-height: 1.45;
        color: var(--bad-strong);
    }

    /* Submit progress: the button label swaps and a hairline sweeps under it,
       so a slow auth never looks like a dead press. */
    .lg-submit {
        width: 100%;
        padding: 15px 18px;
        position: relative;
        overflow: hidden;
    }

    .lg-submit[aria-busy="true"] {
        cursor: default;
    }

    .lg-submit-sweep {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 30%;
        background: color-mix(in srgb, var(--accent-ink) 50%, transparent);
        animation: lg-sweep 1.1s linear infinite;
    }

    @keyframes lg-sweep {
        from { transform: translateX(-100%); }
        to   { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .lg-submit-sweep { animation: none; }
    }

    @media (max-width: 640px) {
        /* Column, so the wordmark below stacks above the form instead of
           sitting beside it. */
        /* Full height of <main>, not 85dvh: the button is meant to sit at the
           bottom edge of the screen, in the thumb zone. */
        .lg-wrap {
            flex-direction: column;
            align-items: stretch;
            min-height: 100%;
            gap: 2.25rem;
            padding: 4rem 1.75rem 2.5rem;
        }

        /* In flow above the title — no absolute corner to sit in on a phone. */
        .lg-mark {
            position: static;
        }

        /* Title and fields at the top, the button pushed down into the thumb
           zone by the auto margin on .lg-foot. */
        .lg-form {
            flex: 1;
            gap: 2.25rem;
        }

        .lg-foot {
            margin-top: auto;
        }

        .lg-title {
            font-size: 32px;
        }
    }
</style>

<div class="lg-wrap">
    <div class="lg-mark">Vitals</div>

    <form class="lg-form animate-float-up" action="/login" method="POST">
        <input type="hidden" name="next" value="{{ next }}">

        <h1 class="lg-title">{{ t("login.heading") }}</h1>

        <div class="lg-fields">
            <div class="lg-field">
                <label class="lg-label" for="lg-username">{{ t("login.username") }}</label>
                <input class="lg-input" type="text" id="lg-username" name="username" required
                       autocomplete="username" autocapitalize="none" spellcheck="false"
                       {% if not error %}autofocus{% endif %}>
            </div>

            <div class="lg-field{% if error %} is-error{% endif %}">
                <div class="lg-field-head">
                    <label class="lg-label" for="lg-password">{{ t("login.password") }}</label>
                    <button class="lg-reveal" type="button" data-lg-reveal
                            aria-controls="lg-password" aria-pressed="false">{{ t("login.reveal") }}</button>
                </div>
                <input class="lg-input" type="password" id="lg-password" name="password" required
                       autocomplete="current-password" {% if error %}autofocus{% endif %}>
            </div>
        </div>

        <div class="lg-foot">
            {% if error %}
            <p class="lg-error" role="alert">{{ error }}</p>
            {% endif %}

            <button class="v-btn lg-submit" type="submit" data-lg-submit>
                <span data-lg-submit-label>{{ t("login.submit") }}</span>
            </button>
        </div>
    </form>
</div>

<script>
    (function () {
        var form = document.querySelector('.lg-form');
        if (!form) return;

        var pw = form.querySelector('#lg-password');
        var reveal = form.querySelector('[data-lg-reveal]');
        var submit = form.querySelector('[data-lg-submit]');
        var label = form.querySelector('[data-lg-submit-label]');
        var strings = {
            reveal: {{ t("login.reveal")|tojson }},
            hide: {{ t("login.hide")|tojson }},
            sending: {{ t("login.submitting")|tojson }}
        };

        // autofocus only fires on a real page load, and a failed login arrives
        // as an hx-boost swap — without this the cursor lands nowhere.
        if (form.querySelector('.lg-error')) pw.focus();

        reveal.addEventListener('click', function () {
            var shown = pw.type === 'text';
            pw.type = shown ? 'password' : 'text';
            reveal.textContent = shown ? strings.reveal : strings.hide;
            reveal.setAttribute('aria-pressed', String(!shown));
        });

        // Guards against a double POST: a second press while the first is in
        // flight finds aria-busy already set and does nothing.
        form.addEventListener('submit', function () {
            if (submit.getAttribute('aria-busy') === 'true') return;
            submit.setAttribute('aria-busy', 'true');
            label.textContent = strings.sending;
            var sweep = document.createElement('span');
            sweep.className = 'lg-submit-sweep';
            submit.appendChild(sweep);
        });
    })();
</script>
{% endblock %}
