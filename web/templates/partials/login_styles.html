<style>
    /* Login screen — variant 1B. The form stands directly on the page
       background: no card, no glass, no blobs. Fields are lines, not boxes,
       so the only filled shape on screen is the one thing you press.

       Shared by /login and the 2FA code step, which is the same screen with one
       field instead of two — a second factor that arrived on a differently
       styled page would read as a phishing hop, not as step two. */
    .lg-wrap {
        position: relative;
        min-height: 85dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .lg-mark {
        position: absolute;
        top: 2rem;
        left: 2.5rem;
        font-family: var(--display);
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--fg);
    }

    .lg-form {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 2.125rem;
    }

    .lg-title {
        margin: 0;
        font-size: 36px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--fg);
    }

    .lg-fields {
        display: flex;
        flex-direction: column;
        gap: 1.625rem;
    }

    /* The line is the field. Rest → --line, focus → accent, error → --bad. */
    .lg-field {
        display: flex;
        flex-direction: column;
        gap: .5rem;
        padding-bottom: .625rem;
        border-bottom: 1px solid var(--line);
        transition: border-color .15s ease;
    }

    .lg-field:focus-within {
        border-bottom-color: var(--accent);
    }

    .lg-field.is-error {
        border-bottom-color: var(--bad);
    }

    .lg-field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .lg-label {
        margin: 0;
        font-size: 11px;
        letter-spacing: .12em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--faint);
    }

    .lg-field.is-error .lg-label {
        color: var(--bad);
    }

    /* Not .v-input — that class is a filled box; here the input is bare text. */
    .lg-input {
        width: 100%;
        background: transparent;
        border: 0;
        padding: 0;
        font-family: inherit;
        /* 21px is well over the 16px below which iOS zooms the viewport on focus. */
        font-size: 21px;
        font-weight: 500;
        color: var(--fg);
    }

    .lg-input:focus {
        outline: none;
    }

    .lg-input::placeholder {
        color: var(--faint);
    }

    /* Autofill would otherwise repaint a white box over the transparent field. */
    .lg-input:-webkit-autofill,
    .lg-input:-webkit-autofill:hover,
    .lg-input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--fg);
        -webkit-box-shadow: 0 0 0 100px var(--bg) inset;
        caret-color: var(--fg);
    }

    #lg-password {
        letter-spacing: .06em;
    }

    /* Six digits, spaced out so the eye counts them without re-reading. Inter
       with tabular-nums, never a monospace face (design system §4). */
    #lg-code {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: .38em;
        font-variant-numeric: tabular-nums;
    }

    /* Padding + matching negative margin: the hit area grows past the 11px
       line without moving anything on screen. */
    .lg-reveal {
        background: none;
        border: 0;
        padding: .625rem 0;
        margin: -.625rem 0;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--muted);
        transition: color .15s ease;
    }

    .lg-reveal:hover {
        color: var(--fg);
    }

    .lg-foot {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    /* Error sits above the button, in text — an alert box here would put a
       second filled shape next to the CTA and split the eye. */
    .lg-error {
        font-size: var(--text-body);
        line-height: 1.45;
        color: var(--bad-strong);
    }

    /* The way back out of the code step, kept quiet — it is the escape hatch,
       not an option competing with the CTA above it. */
    .lg-alt {
        align-self: center;
        font-size: var(--text-body);
        color: var(--muted);
        text-decoration: none;
        transition: color .15s ease;
    }

    .lg-alt:hover {
        color: var(--fg);
    }

    /* Submit progress: the button label swaps and a hairline sweeps under it,
       so a slow auth never looks like a dead press. */
    .lg-submit {
        width: 100%;
        padding: 15px 18px;
        position: relative;
        overflow: hidden;
    }

    .lg-submit[aria-busy="true"] {
        cursor: default;
    }

    .lg-submit-sweep {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 30%;
        background: color-mix(in srgb, var(--accent-ink) 50%, transparent);
        animation: lg-sweep 1.1s linear infinite;
    }

    @keyframes lg-sweep {
        from { transform: translateX(-100%); }
        to   { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .lg-submit-sweep { animation: none; }
    }

    @media (max-width: 640px) {
        /* Column, so the wordmark below stacks above the form instead of
           sitting beside it. */
        /* Full height of <main>, not 85dvh: the button is meant to sit at the
           bottom edge of the screen, in the thumb zone. */
        .lg-wrap {
            flex-direction: column;
            align-items: stretch;
            min-height: 100%;
            gap: 2.25rem;
            padding: 4rem 1.75rem 2.5rem;
        }

        /* In flow above the title — no absolute corner to sit in on a phone. */
        .lg-mark {
            position: static;
        }

        /* Title and fields at the top, the button pushed down into the thumb
           zone by the auto margin on .lg-foot. */
        .lg-form {
            flex: 1;
            gap: 2.25rem;
        }

        .lg-foot {
            margin-top: auto;
        }

        /* The 2FA step carries one short field, so the push-to-thumb-zone layout
           leaves most of the screen empty and the form reads as broken rather
           than as spacious. Centre it instead — and the code auto-submits at six
           digits anyway, so the button is rarely the thing being reached for. */
        .lg-wrap.is-compact {
            justify-content: center;
        }

        .is-compact .lg-form {
            flex: none;
        }

        .is-compact .lg-foot {
            margin-top: 0;
        }

        .lg-title {
            font-size: 32px;
        }
    }
</style>
