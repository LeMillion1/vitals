[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: exercises Postgres-specific behavior (JSONB / GIN / partial-unique / func.date); run with VITALS_TEST_DATABASE_URL pointed at a real Postgres (scripts/test_postgres.sh)
    pre_ownership_contract: builds the schema as it stood before the ownership contract made the registered-required ownership columns NOT NULL. Only the ownership backfill machinery and the legacy-bridge tests may use it: writing a row with no owner is what those exercise, and the application itself can no longer produce one.
