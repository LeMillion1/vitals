x-vitals-runtime: &vitals-runtime
  build: .
  # Every application process in one project runs identical bytes. Deployment
  # supplies an immutable commit tag; local/manual Compose retains `local`.
  image: ${COMPOSE_PROJECT_NAME:-vitals}_runtime:${VITALS_IMAGE_TAG:-local}

services:
  vitals_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${VITALS_DB_USER:-vitals_admin}
      POSTGRES_PASSWORD: ${VITALS_DB_PASSWORD:?VITALS_DB_PASSWORD must be set}
      POSTGRES_DB: ${VITALS_DB_NAME:-vitals_db}
    volumes:
      - vitals_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vitals_admin} -d $${POSTGRES_DB:-vitals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vitals_redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - vitals_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Schema changes run with the owner/exempt role, never with the web runtime
  # credential. This service is intentionally one-shot and contains no provider
  # credentials or application settings beyond the migration database URL.
  vitals_migrate:
    <<: *vitals-runtime
    depends_on:
      vitals_db:
        condition: service_healthy
    environment:
      VITALS_DATABASE_URL: ${VITALS_MIGRATION_DATABASE_URL:?VITALS_MIGRATION_DATABASE_URL must be set}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Re-apply least-privilege grants after every migration so newly created
  # tables and sequences are available without making the application an owner.
  vitals_db_roles:
    <<: *vitals-runtime
    depends_on:
      vitals_migrate:
        condition: service_completed_successfully
    environment:
      VITALS_MIGRATION_DATABASE_URL: ${VITALS_MIGRATION_DATABASE_URL:?VITALS_MIGRATION_DATABASE_URL must be set}
      VITALS_DATABASE_URL: ${VITALS_DATABASE_URL:?VITALS_DATABASE_URL must be set}
      VITALS_WORKER_DATABASE_URL: ${VITALS_WORKER_DATABASE_URL:?VITALS_WORKER_DATABASE_URL must be set}
    command: ["python", "scripts/provision_runtime_db_role.py"]
    restart: "no"

  vitals_app:
    <<: *vitals-runtime
    depends_on:
      vitals_db_roles:
        condition: service_completed_successfully
      vitals_redis:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
      # Compose deployments fail startup if the mounted application file
      # contains a DB-owner/control-plane key or if one is injected directly.
      VITALS_RUNTIME_ENV_ISOLATION_REQUIRED: "true"
      VITALS_ENV_FILE: /run/vitals-runtime/vitals.env
      VITALS_PROCESS_MODE: web
    # No `env_file:` here on purpose: it would inject a snapshot of .env as
    # container-level env vars at creation time, which then permanently shadows
    # the live bind-mounted file below (python-dotenv's load_dotenv() never
    # overrides an already-set var) — so Settings-page edits would survive a
    # container restart only by luck, never actually applying until the next
    # full recreate. The bind mount alone is enough: every process start reads
    # the file fresh.
    volumes:
      # Never mount the host operator .env here: it contains the migration DSN
      # and PostgreSQL owner password. Settings atomically replaces the separate
      # allowlisted file, so mount its containing directory rather than making
      # the file itself an EBUSY bind-mount point. create_host_path=false refuses
      # a missing directory instead of silently creating one.
      - type: bind
        source: ${VITALS_RUNTIME_ENV_DIR:-.vitals-runtime}
        target: /run/vitals-runtime
        bind:
          create_host_path: false
      # Persist the Garmin (garth) OAuth token session across rebuilds/restarts so
      # we don't re-login every deploy — frequent logins risk a captcha/MFA prompt
      # and a temporary block. Matches VITALS_GARMIN_TOKEN_DIR (default below).
      - vitals_garmin_session:/data/garmin_session
      # Persist progress photos and lab document uploads across rebuilds/restarts
      - ./web/static/uploads:/app/web/static/uploads
      # New private-local files never enter the static tree. The application
      # resolves opaque metadata into this owner-only volume after authorizing
      # every request (care attachments are the first caller).
      - vitals_private_files:/data/private_files

    ports:
      # Loopback-only: health/genetic data must not sit open on the public
      # internet. Reach it via SSH tunnel (ssh -L 8000:localhost:8000 vitals)
      # or put a TLS reverse proxy / VPN (Tailscale) in front. The plan requires
      # this app to live behind a VPN/firewall.
      - "127.0.0.1:${VITALS_APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped

  # APScheduler and every provider/background job live in this process. The
  # canonical database setting is deliberately mapped from the host-only worker
  # DSN; the source key itself never enters the restricted process environment.
  vitals_worker:
    <<: *vitals-runtime
    depends_on:
      vitals_db_roles:
        condition: service_completed_successfully
      vitals_redis:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
      VITALS_RUNTIME_ENV_ISOLATION_REQUIRED: "true"
      VITALS_ENV_FILE: /run/vitals-runtime/vitals.env
      VITALS_PROCESS_MODE: worker
      VITALS_DATABASE_URL: ${VITALS_WORKER_DATABASE_URL:?VITALS_WORKER_DATABASE_URL must be set}
    command: ["python", "-m", "vitals.worker"]
    volumes:
      # The worker reads shared application/provider settings but never writes
      # the Settings-owned runtime file. Its process-level DB URL above wins
      # over the web URL stored in this file.
      - type: bind
        source: ${VITALS_RUNTIME_ENV_DIR:-.vitals-runtime}
        target: /run/vitals-runtime
        read_only: true
        bind:
          create_host_path: false
      - vitals_garmin_session:/data/garmin_session
      - ./web/static/uploads:/app/web/static/uploads
      - vitals_private_files:/data/private_files
    healthcheck:
      test: ["CMD", "python", "-m", "vitals.worker_health"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s
    stop_grace_period: 90s
    restart: unless-stopped

  # ── Identity provider ────────────────────────────────────────────────────
  #
  # Behind a profile, so it does not start until you ask for it:
  #
  #     docker compose --profile idp up -d
  #
  # Starting the provider is preparation, not the cutover. Vitals switches only
  # after its complete OIDC application group is configured. Read
  # docs/OIDC_SETUP.md before either step.
  #
  # ZITADEL v4 is deliberately split into one-shot schema/setup phases, API,
  # Login V2, and an h2c-aware gateway. Only the gateway publishes a loopback
  # port; no provider container can see the Vitals database or runtime file.
  vitals_idp_config_check:
    image: postgres:15-alpine
    profiles: ["idp"]
    environment:
      VITALS_IDP_MASTERKEY_FILE: /run/secrets/idp_masterkey
      VITALS_IDP_DB_ADMIN_PASSWORD_FILE: /run/secrets/idp_db_admin_password
      VITALS_IDP_DB_SERVICE_PASSWORD_FILE: /run/secrets/idp_db_service_password
      VITALS_IDP_DB_BACKUP_PASSWORD_FILE: /run/secrets/idp_db_backup_password
      VITALS_IDP_ADMIN_PASSWORD_FILE: /run/secrets/idp_admin_password
      VITALS_IDP_DOMAIN: ${VITALS_IDP_DOMAIN:-localhost}
      VITALS_IDP_PUBLIC_SCHEME: ${VITALS_IDP_PUBLIC_SCHEME:-http}
      VITALS_IDP_SECURE: ${VITALS_IDP_SECURE:-false}
      VITALS_IDP_EXTERNAL_PORT: ${VITALS_IDP_EXTERNAL_PORT:-8080}
      VITALS_IDP_ORIGIN_PORT: ${VITALS_IDP_ORIGIN_PORT:-8080}
      VITALS_IDP_ADMIN_USERNAME: ${VITALS_IDP_ADMIN_USERNAME:-zitadel-admin}
      VITALS_IDP_ADMIN_EMAIL: ${VITALS_IDP_ADMIN_EMAIL:-admin@localhost.test}
      VITALS_IDP_LOGIN_PAT_EXPIRATION: ${VITALS_IDP_LOGIN_PAT_EXPIRATION:-2027-08-26T00:00:00Z}
    secrets:
      - idp_masterkey
      - idp_db_admin_password
      - idp_db_service_password
      - idp_db_backup_password
      - idp_admin_password
    volumes:
      - ./scripts/idp_config_check.sh:/usr/local/bin/idp_config_check.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/idp_config_check.sh"]
    restart: "no"

  vitals_idp_config_render:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
    environment:
      VITALS_IDP_DB_SERVICE_PASSWORD_FILE: /run/secrets/idp_db_service_password
      VITALS_IDP_ADMIN_PASSWORD_FILE: /run/secrets/idp_admin_password
      VITALS_IDP_ADMIN_USERNAME: ${VITALS_IDP_ADMIN_USERNAME:-zitadel-admin}
      VITALS_IDP_ADMIN_EMAIL: ${VITALS_IDP_ADMIN_EMAIL:-admin@localhost.test}
      VITALS_IDP_LOGIN_PAT_EXPIRATION: ${VITALS_IDP_LOGIN_PAT_EXPIRATION:-2027-08-26T00:00:00Z}
    secrets:
      - idp_db_service_password
      - idp_admin_password
    volumes:
      - ./scripts/idp_render_config.sh:/usr/local/bin/idp_render_config.sh:ro
      - vitals_idp_config:/zitadel/config:rw
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "/usr/local/bin/idp_render_config.sh"]
    restart: "no"

  vitals_idp_bootstrap_prepare:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
    volumes:
      - vitals_idp_bootstrap:/zitadel/bootstrap:rw
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /zitadel/bootstrap && chmod 700 /zitadel/bootstrap"]
    restart: "no"

  # Its own cluster and database: the cluster superuser exists only in this
  # container and the two role-provisioning jobs. ZITADEL receives a dedicated
  # non-superuser database owner instead.
  vitals_idp_db:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/idp_db_admin_password
      POSTGRES_DB: postgres
    secrets:
      - idp_db_admin_password
    volumes:
      - vitals_idp_pgdata:/var/lib/postgresql/data
    networks: [vitals_idp_internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  vitals_idp_db_provision:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
      vitals_idp_db:
        condition: service_healthy
    environment:
      VITALS_IDP_DB_ADMIN_PASSWORD_FILE: /run/secrets/idp_db_admin_password
      VITALS_IDP_DB_SERVICE_PASSWORD_FILE: /run/secrets/idp_db_service_password
      VITALS_IDP_DB_BACKUP_PASSWORD_FILE: /run/secrets/idp_db_backup_password
    secrets:
      - idp_db_admin_password
      - idp_db_service_password
      - idp_db_backup_password
    volumes:
      - ./scripts/provision_idp_db_roles.sh:/usr/local/bin/provision_idp_db_roles.sh:ro
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "/usr/local/bin/provision_idp_db_roles.sh"]
    command: ["provision"]
    restart: "no"

  vitals_idp_init:
    image: ghcr.io/zitadel/zitadel:v4.16.2@sha256:4b68a2106f60baa2895e5a00a77fcd915d29d0db3f0c011d3eb9f99f557b2b48
    profiles: ["idp"]
    depends_on:
      vitals_idp_db_provision:
        condition: service_completed_successfully
      vitals_idp_config_render:
        condition: service_completed_successfully
    volumes:
      - vitals_idp_config:/zitadel/config:ro
    networks: [vitals_idp_internal]
    command: ["init", "schema", "--config", "/zitadel/config/config.yaml"]
    restart: "no"

  vitals_idp_setup:
    image: ghcr.io/zitadel/zitadel:v4.16.2@sha256:4b68a2106f60baa2895e5a00a77fcd915d29d0db3f0c011d3eb9f99f557b2b48
    profiles: ["idp"]
    depends_on:
      vitals_idp_init:
        condition: service_completed_successfully
      vitals_idp_bootstrap_prepare:
        condition: service_completed_successfully
    environment:
      ZITADEL_EXTERNALDOMAIN: ${VITALS_IDP_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${VITALS_IDP_EXTERNAL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: ${VITALS_IDP_SECURE:-false}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${VITALS_IDP_PUBLIC_SCHEME:-http}://${VITALS_IDP_DOMAIN:-localhost}:${VITALS_IDP_EXTERNAL_PORT:-8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${VITALS_IDP_PUBLIC_SCHEME:-http}://${VITALS_IDP_DOMAIN:-localhost}:${VITALS_IDP_EXTERNAL_PORT:-8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${VITALS_IDP_PUBLIC_SCHEME:-http}://${VITALS_IDP_DOMAIN:-localhost}:${VITALS_IDP_EXTERNAL_PORT:-8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${VITALS_IDP_PUBLIC_SCHEME:-http}://${VITALS_IDP_DOMAIN:-localhost}:${VITALS_IDP_EXTERNAL_PORT:-8080}/ui/v2/login/login?samlRequest=
    secrets:
      - idp_masterkey
    volumes:
      - vitals_idp_config:/zitadel/config:ro
      - vitals_idp_bootstrap:/zitadel/bootstrap:rw
    networks: [vitals_idp_internal]
    command: ["setup", "--masterkeyFile", "/run/secrets/idp_masterkey", "--config", "/zitadel/config/config.yaml", "--steps", "/zitadel/config/steps.yaml", "--init-projections=true"]
    restart: "no"

  vitals_idp_bootstrap_seal:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_setup:
        condition: service_completed_successfully
    volumes:
      - vitals_idp_bootstrap:/zitadel/bootstrap:rw
      - vitals_idp_config:/zitadel/config:rw
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -s /zitadel/bootstrap/login-client.pat
        && test ! -L /zitadel/bootstrap/login-client.pat
        && chown 1000:65533 /zitadel/bootstrap/login-client.pat
        && chmod 640 /zitadel/bootstrap/login-client.pat
        && chown 1000:65533 /zitadel/bootstrap
        && chmod 750 /zitadel/bootstrap
        && test -f /zitadel/config/steps.yaml
        && rm -f /zitadel/config/steps.yaml
    restart: "no"

  vitals_idp_db_grants:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_bootstrap_seal:
        condition: service_completed_successfully
    environment:
      VITALS_IDP_DB_ADMIN_PASSWORD_FILE: /run/secrets/idp_db_admin_password
      VITALS_IDP_DB_SERVICE_PASSWORD_FILE: /run/secrets/idp_db_service_password
      VITALS_IDP_DB_BACKUP_PASSWORD_FILE: /run/secrets/idp_db_backup_password
    secrets:
      - idp_db_admin_password
      - idp_db_service_password
      - idp_db_backup_password
    volumes:
      - ./scripts/provision_idp_db_roles.sh:/usr/local/bin/provision_idp_db_roles.sh:ro
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "/usr/local/bin/provision_idp_db_roles.sh"]
    command: ["grant-backup"]
    restart: "no"

  vitals_idp:
    image: ghcr.io/zitadel/zitadel:v4.16.2@sha256:4b68a2106f60baa2895e5a00a77fcd915d29d0db3f0c011d3eb9f99f557b2b48
    profiles: ["idp"]
    depends_on:
      vitals_idp_db_grants:
        condition: service_completed_successfully
    environment:
      ZITADEL_EXTERNALDOMAIN: ${VITALS_IDP_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${VITALS_IDP_EXTERNAL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: ${VITALS_IDP_SECURE:-false}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_PORT: 8080
    secrets:
      - idp_masterkey
    volumes:
      - vitals_idp_config:/zitadel/config:ro
    networks: [vitals_idp_internal]
    command: ["start", "--masterkeyFile", "/run/secrets/idp_masterkey", "--config", "/zitadel/config/config.yaml"]
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  vitals_idp_login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2@sha256:f35e20cf3edd4a45a44c548b887c58304b350ed56078546735015f5cd17eef75
    profiles: ["idp"]
    depends_on:
      vitals_idp:
        condition: service_healthy
    environment:
      ZITADEL_API_URL: http://vitals_idp:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${VITALS_IDP_DOMAIN:-localhost}:${VITALS_IDP_EXTERNAL_PORT:-8080},X-Forwarded-Proto:${VITALS_IDP_PUBLIC_SCHEME:-http}
    volumes:
      - vitals_idp_bootstrap:/zitadel/bootstrap:ro
    networks: [vitals_idp_internal]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  vitals_idp_gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: ["idp"]
    depends_on:
      vitals_idp:
        condition: service_healthy
      vitals_idp_login:
        condition: service_healthy
    environment:
      VITALS_IDP_DOMAIN: ${VITALS_IDP_DOMAIN:-localhost}
      VITALS_IDP_PUBLIC_SCHEME: ${VITALS_IDP_PUBLIC_SCHEME:-http}
      VITALS_IDP_EXTERNAL_PORT: ${VITALS_IDP_EXTERNAL_PORT:-8080}
    volumes:
      - ./deploy/zitadel/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - vitals_idp_internal
      - vitals_idp_edge
    ports:
      - "127.0.0.1:${VITALS_IDP_ORIGIN_PORT:-8080}:8080"
    read_only: true
    cap_drop: ["ALL"]
    # The official image marks the binary with this file capability. Retaining
    # only that capability is required for exec even though our origin is 8080.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m
      - /config:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/debug/ready"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # A separate recovery stream for the identity store. Health-store success
  # cannot prove that anybody will be able to log in after a disaster, and the
  # two databases must be restorable on independent timelines.
  vitals_idp_backup:
    image: postgres:15-alpine
    profiles: ["idp"]
    depends_on:
      vitals_idp_gateway:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
      PGHOST: vitals_idp_db
      PGUSER: zitadel_backup
      PGDATABASE: zitadel
      VITALS_IDP_DB_PASSWORD_FILE: /run/secrets/idp_db_backup_password
      VITALS_IDP_BOOTSTRAP_PAT_FILE: /zitadel/bootstrap/login-client.pat
      VITALS_IDP_BACKUP_RETENTION_DAYS: ${VITALS_IDP_BACKUP_RETENTION_DAYS:-7}
    secrets:
      - idp_db_backup_password
    # Login V2 runs as gid 65533; the sealed PAT is group-readable so backup
    # can copy it without granting world access or running with DAC override.
    group_add: ["65533"]
    volumes:
      - ./scripts/idp_backup.sh:/usr/local/bin/idp_backup.sh:ro
      - ${VITALS_IDP_BACKUP_HOST_DIR:-./backups}:/backups
      - vitals_idp_bootstrap:/zitadel/bootstrap:ro
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "/usr/local/bin/idp_backup.sh"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    restart: unless-stopped

  # Operator-invoked only. It refuses a non-empty database/bootstrap target and
  # restores one checksum-verified SQL+PAT pair into a fresh Compose project.
  # Enable both profiles; after success, start the normal idp profile so the
  # pinned version's init/setup phases verify and advance the restored schema.
  vitals_idp_restore:
    image: postgres:15-alpine
    profiles: ["idp-restore"]
    depends_on:
      vitals_idp_db_provision:
        condition: service_completed_successfully
      vitals_idp_bootstrap_prepare:
        condition: service_completed_successfully
    environment:
      PGHOST: vitals_idp_db
      PGUSER: zitadel
      PGDATABASE: zitadel
      VITALS_IDP_DB_PASSWORD_FILE: /run/secrets/idp_db_service_password
      VITALS_IDP_RESTORE_MANIFEST: ${VITALS_IDP_RESTORE_MANIFEST:-}
    secrets:
      - idp_db_service_password
    volumes:
      - ./scripts/idp_restore.sh:/usr/local/bin/idp_restore.sh:ro
      - ${VITALS_IDP_BACKUP_HOST_DIR:-./backups}:/backups:ro
      - vitals_idp_bootstrap:/zitadel/bootstrap:rw
    networks: [vitals_idp_internal]
    entrypoint: ["/bin/sh", "/usr/local/bin/idp_restore.sh"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    restart: "no"

  vitals_backup:
    image: postgres:15-alpine
    depends_on:
      vitals_db:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
      PGHOST: vitals_db
      PGUSER: ${VITALS_DB_USER:-vitals_admin}
      PGPASSWORD: ${VITALS_DB_PASSWORD:?VITALS_DB_PASSWORD must be set}
      PGDATABASE: ${VITALS_DB_NAME:-vitals_db}
      VITALS_BACKUP_RETENTION_DAYS: ${VITALS_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      # The Garmin token store, read-only: the database can always be re-synced
      # from Garmin, but a lost session may be impossible to log back in.
      - vitals_garmin_session:/garmin_session:ro
      # Care-message attachments and later private-local medical files.
      - vitals_private_files:/private_files:ro
      # Pre-relocation medical uploads remain recoverable until the legacy
      # directory can be retired on every installation.
      - ./web/static/uploads:/legacy_uploads:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    restart: unless-stopped

  # Encrypted off-host replication is opt-in and refuses to initialize a
  # repository. Create and escrow the four secret files on the host, initialize
  # a versioned S3 repository from a trusted admin machine, and deny the
  # production credential deletion of packs, indexes, snapshots, and keys;
  # then start only this sidecar without reconciling the application stack:
  # docker compose --profile offsite up -d --no-deps vitals_offsite_backup.
  vitals_offsite_backup:
    image: ghcr.io/restic/restic:0.19.1@sha256:2f0373803493361f9304a57150d464677f69a9dad487afec202105aafb2592f2
    profiles: ["offsite"]
    hostname: ${VITALS_OFFSITE_HOSTNAME:-vitals-installation}
    depends_on:
      vitals_backup:
        condition: service_started
    environment:
      RESTIC_REPOSITORY_FILE: /run/secrets/restic_repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      VITALS_RESTIC_S3_ACCESS_KEY_FILE: /run/secrets/restic_s3_access_key
      VITALS_RESTIC_S3_SECRET_KEY_FILE: /run/secrets/restic_s3_secret_key
      AWS_EC2_METADATA_DISABLED: "true"
      RESTIC_CACHE_DIR: /tmp/restic-cache
      VITALS_OFFSITE_HOSTNAME: ${VITALS_OFFSITE_HOSTNAME:-vitals-installation}
      VITALS_OFFSITE_INTERVAL_SECONDS: ${VITALS_OFFSITE_INTERVAL_SECONDS:-900}
      VITALS_OFFSITE_RUNTIME_ENV_FILE: /source/vitals.runtime.env
    secrets:
      - restic_repository
      - restic_password
      - restic_s3_access_key
      - restic_s3_secret_key
    volumes:
      - ./scripts/offsite_backup.sh:/usr/local/bin/offsite_backup.sh:ro
      - ./backups:/backups:ro
      - ./.env:/source/vitals.env:ro
      - type: bind
        source: ${VITALS_RUNTIME_ENV_DIR:-.vitals-runtime}/vitals.env
        target: /source/vitals.runtime.env
        read_only: true
        bind:
          create_host_path: false
      - vitals_offsite_state:/state
    entrypoint: ["/bin/sh", "/usr/local/bin/offsite_backup.sh"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    restart: unless-stopped

  # Identity replication is a separate failure domain and encrypted repository.
  # It deliberately cannot read the Vitals .env or any health-store artifact.
  # Start it only after initializing and escrowing the dedicated repository:
  # docker compose --profile idp-offsite up -d --no-deps vitals_idp_offsite_backup.
  vitals_idp_offsite_backup:
    image: ghcr.io/restic/restic:0.19.1@sha256:2f0373803493361f9304a57150d464677f69a9dad487afec202105aafb2592f2
    profiles: ["idp-offsite"]
    hostname: ${VITALS_IDP_OFFSITE_HOSTNAME:-vitals-identity}
    environment:
      RESTIC_REPOSITORY_FILE: /run/secrets/idp_restic_repository
      RESTIC_PASSWORD_FILE: /run/secrets/idp_restic_password
      VITALS_IDP_RESTIC_S3_ACCESS_KEY_FILE: /run/secrets/idp_restic_s3_access_key
      VITALS_IDP_RESTIC_S3_SECRET_KEY_FILE: /run/secrets/idp_restic_s3_secret_key
      AWS_EC2_METADATA_DISABLED: "true"
      RESTIC_CACHE_DIR: /tmp/restic-cache
      VITALS_IDP_OFFSITE_HOSTNAME: ${VITALS_IDP_OFFSITE_HOSTNAME:-vitals-identity}
      VITALS_IDP_OFFSITE_INTERVAL_SECONDS: ${VITALS_IDP_OFFSITE_INTERVAL_SECONDS:-900}
    secrets:
      - idp_restic_repository
      - idp_restic_password
      - idp_restic_s3_access_key
      - idp_restic_s3_secret_key
    volumes:
      - ./scripts/idp_offsite_backup.sh:/usr/local/bin/idp_offsite_backup.sh:ro
      - ${VITALS_IDP_BACKUP_HOST_DIR:-./backups}/idp:/backups/idp:ro
      - vitals_idp_offsite_state:/state
    entrypoint: ["/bin/sh", "/usr/local/bin/idp_offsite_backup.sh"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    restart: unless-stopped

volumes:
  vitals_pgdata:
