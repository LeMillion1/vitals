  idp_admin_password:
    file: ${VITALS_IDP_ADMIN_PASSWORD_FILE:-.secrets/idp_admin_password}
  restic_repository:
    file: ${VITALS_RESTIC_REPOSITORY_FILE:-.secrets/restic_repository}
  restic_password:
    file: ${VITALS_RESTIC_PASSWORD_FILE:-.secrets/restic_password}
  restic_s3_access_key:
    file: ${VITALS_RESTIC_S3_ACCESS_KEY_FILE:-.secrets/restic_s3_access_key}
  restic_s3_secret_key:
    file: ${VITALS_RESTIC_S3_SECRET_KEY_FILE:-.secrets/restic_s3_secret_key}
  idp_restic_repository:
    file: ${VITALS_IDP_RESTIC_REPOSITORY_FILE:-.secrets/idp_restic_repository}
  idp_restic_password:
    file: ${VITALS_IDP_RESTIC_PASSWORD_FILE:-.secrets/idp_restic_password}
  idp_restic_s3_access_key:
    file: ${VITALS_IDP_RESTIC_S3_ACCESS_KEY_FILE:-.secrets/idp_restic_s3_access_key}
