services:
  vitals_db:
    image: postgres:15-alpine
    container_name: vitals_db
    environment:
      POSTGRES_USER: ${VITALS_DB_USER:-vitals}
      POSTGRES_PASSWORD: ${VITALS_DB_PASSWORD:?VITALS_DB_PASSWORD must be set}
      POSTGRES_DB: ${VITALS_DB_NAME:-vitals_db}
    volumes:
      - vitals_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vitals} -d $${POSTGRES_DB:-vitals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vitals_redis:
    image: redis:7-alpine
    container_name: vitals_redis
    restart: unless-stopped
    volumes:
      - vitals_redis_data:/data

  vitals_app:
    build: .
    container_name: vitals_app
    depends_on:
      vitals_db:
        condition: service_healthy
      vitals_redis:
        condition: service_started
    environment:
      TZ: Europe/Chisinau
    # No `env_file:` here on purpose: it would inject a snapshot of .env as
    # container-level env vars at creation time, which then permanently shadows
    # the live bind-mounted file below (python-dotenv's load_dotenv() never
    # overrides an already-set var) — so Settings-page edits would survive a
    # container restart only by luck, never actually applying until the next
    # full recreate. The bind mount alone is enough: every process start reads
    # the file fresh.
    volumes:
      - .env:/app/.env
      # Persist the Garmin (garth) OAuth token session across rebuilds/restarts so
      # we don't re-login every deploy — frequent logins risk a captcha/MFA prompt
      # and a temporary block. Matches VITALS_GARMIN_TOKEN_DIR (default below).
      - vitals_garmin_session:/data/garmin_session
      # Persist progress photos and lab document uploads across rebuilds/restarts
      - ./web/static/uploads:/app/web/static/uploads

    ports:
      # Loopback-only: health/genetic data must not sit open on the public
      # internet. Reach it via SSH tunnel (ssh -L 8000:localhost:8000 vitals)
      # or put a TLS reverse proxy / VPN (Tailscale) in front. The plan requires
      # this app to live behind a VPN/firewall.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # ── Identity provider ────────────────────────────────────────────────────
  #
  # Behind a profile, so it does not start until you ask for it:
  #
  #     docker compose --profile idp up -d
  #
  # Starting the provider is preparation, not the cutover. Vitals switches only
  # after its complete OIDC application group is configured. Read
  # docs/OIDC_SETUP.md before either step.
  #
  # The pinned ZITADEL v2.66.0 tag is Apache-2.0. Re-check the exact tag's
  # licence before upgrading; a later release may use different terms.
  vitals_idp_config_check:
    image: postgres:15-alpine
    profiles: ["idp"]
    environment:
      VITALS_IDP_MASTERKEY: ${VITALS_IDP_MASTERKEY:-}
      VITALS_IDP_DB_PASSWORD: ${VITALS_IDP_DB_PASSWORD:-}
      VITALS_IDP_ADMIN_PASSWORD: ${VITALS_IDP_ADMIN_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        [ "$${#VITALS_IDP_MASTERKEY}" -eq 32 ] || {
          echo "VITALS_IDP_MASTERKEY must contain exactly 32 characters" >&2
          exit 1
        }
        [ -n "$${VITALS_IDP_DB_PASSWORD}" ] || {
          echo "VITALS_IDP_DB_PASSWORD must be set" >&2
          exit 1
        }
        [ -n "$${VITALS_IDP_ADMIN_PASSWORD}" ] || {
          echo "VITALS_IDP_ADMIN_PASSWORD must be set" >&2
          exit 1
        }
    restart: "no"

  vitals_idp:
    image: ghcr.io/zitadel/zitadel:v2.66.0
    container_name: vitals_idp
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
      vitals_idp_db:
        condition: service_healthy
    command: >
      start-from-init
      --masterkeyFromEnv
      --tlsMode external
    environment:
      # Compose interpolates every service before applying profiles. Keep these
      # values empty when the optional profile is not selected so ordinary
      # `docker compose up` does not demand IDP secrets. The IDP containers
      # themselves are guarded by the profile's runtime preflight above.
      ZITADEL_MASTERKEY: ${VITALS_IDP_MASTERKEY:-}
      # v2.66.0 otherwise creates a first administrator with a known default.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${VITALS_IDP_ADMIN_PASSWORD:-}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      # Vitals provisions and links every account explicitly. ZITADEL defaults
      # this to true, which would advertise a sign-up flow that can only create
      # an orphan identity with no Vitals account or health subject.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_EXTERNALDOMAIN: ${VITALS_IDP_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${VITALS_IDP_PORT:-8080}
      ZITADEL_EXTERNALSECURE: ${VITALS_IDP_SECURE:-false}
      ZITADEL_DATABASE_POSTGRES_HOST: vitals_idp_db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${VITALS_IDP_DB_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${VITALS_IDP_DB_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    ports:
      # Same reasoning as the app: bound to loopback, because this is the door
      # to the health record and belongs behind the same VPN.
      - "127.0.0.1:${VITALS_IDP_PORT:-8080}:8080"
    restart: unless-stopped

  # Its own database rather than a schema in the app's. They have different
  # backup and restore rhythms — losing the identity store means logging back
  # in, losing the health store means losing the record — and one pg_dump that
  # holds both invites restoring both when you meant one.
  vitals_idp_db:
    image: postgres:15-alpine
    container_name: vitals_idp_db
    profiles: ["idp"]
    depends_on:
      vitals_idp_config_check:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${VITALS_IDP_DB_PASSWORD:-}
      POSTGRES_DB: zitadel
    volumes:
      - vitals_idp_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 5

  vitals_backup:
    image: postgres:15-alpine
    container_name: vitals_backup
    depends_on:
      vitals_db:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
      PGHOST: vitals_db
      PGUSER: ${VITALS_DB_USER:-vitals}
      PGPASSWORD: ${VITALS_DB_PASSWORD:?VITALS_DB_PASSWORD must be set}
      PGDATABASE: ${VITALS_DB_NAME:-vitals_db}
      VITALS_BACKUP_RETENTION_DAYS: ${VITALS_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      # The Garmin token store, read-only: the database can always be re-synced
      # from Garmin, but a lost session may be impossible to log back in.
      - vitals_garmin_session:/garmin_session:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    restart: unless-stopped

volumes:
  vitals_pgdata:
  vitals_redis_data:
  vitals_garmin_session:
  vitals_idp_pgdata:
